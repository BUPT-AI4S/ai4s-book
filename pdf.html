<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教材 PDF 阅读器</title><link rel="stylesheet" href="static/vendor/pdfjs/pdf_viewer.css"><link rel="stylesheet" href="static/css/pdf-reader.css"></head><body>
<header class="pdf-toolbar"><button id="previous" type="button" aria-label="上一页">上一页</button><label for="page-number" id="page-label">页码</label><input id="page-number" type="number" min="1" value="1"><span id="page-count">/ —</span><button id="next" type="button" aria-label="下一页">下一页</button><span class="pdf-toolbar-divider"></span><button id="zoom-out" type="button" aria-label="缩小">−</button><span id="zoom-level">100%</span><button id="zoom-in" type="button" aria-label="放大">+</button><button id="fit-width" type="button">适合宽度</button><a id="pdf-download" target="_blank" rel="noopener noreferrer" hidden>下载 PDF</a></header>
<div id="viewer-container" tabindex="0" aria-label="教材正文"><div id="pdf-viewer" class="pdfViewer"></div></div><div id="pdf-message" role="status" aria-live="polite"><span id="pdf-message-text">正在加载 PDF…</span><button id="retry-pdf" type="button" hidden>重试</button></div>
<script type="module" src="static/js/pdf-reader.mjs?v=20261015"></script></body></html>
